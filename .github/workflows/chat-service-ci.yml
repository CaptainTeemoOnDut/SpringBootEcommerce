name: Chat Service CI

on:
  push:
    branches:
      - main
      - githubaction
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Chat Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ./chat-teria-service
        run: chmod +x ./mvnw && ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./chat-teria-service
          file: ./chat-teria-service/Dockerfile
          push: true
          tags: vothanhthienlong/chat-service:latest