name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    # 1. Khai báo Redis service container cho GitHub Actions runner
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ./demo-identity-service
        # 2. Truyền biến môi trường REDIS_URL kết nối tới Redis service vừa tạo ở trên
        env:
          REDIS_URL: redis://localhost:6379
        run: chmod +x ./mvnw && ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./demo-identity-service
          file: ./demo-identity-service/Dockerfile
          push: true
          tags: vothanhthienlong/demo-identity-service:latest

      - name: Deploy Identity Service to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/ecommerce

            docker compose -f docker-compose.prod.yml pull identity-service

            docker compose -f docker-compose.prod.yml up -d identity-service

            docker image prune -f