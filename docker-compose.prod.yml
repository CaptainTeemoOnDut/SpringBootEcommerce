services:

  # =========================================================
  # MySQL
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: full-stack-ecommerce
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ecommerce-network


  # =========================================================
  # Redis
  # =========================================================
  redis:
    image: redis:6.2
    container_name: demo-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce-network


  # =========================================================
  # MongoDB
  # =========================================================
  mongodb:
    image: mongo:latest
    container_name: my-mongo
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ecommerce-network


  # =========================================================
  # PostgreSQL + pgvector
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector_container
    restart: unless-stopped

    environment:
      POSTGRES_DB: vector_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d vector_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ecommerce-network


  # =========================================================
  # Identity Service
  # =========================================================
  identity-service:
    image: vothanhthienlong/demo-identity-service:latest
    container_name: demo-identity-service
    restart: unless-stopped

    environment:

      DBMS_CONNECTION: jdbc:mysql://mysql:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC

      DBMS_USERNAME: ${MYSQL_USER}
      DBMS_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_URL: redis://redis:6379

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      JWT_VALID_DURATION: ${JWT_VALID_DURATION}
      JWT_TTL: ${JWT_TTL}
      JWT_ISSUER: ${JWT_ISSUER}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_SUCCESS_PATH: ${FRONTEND_SUCCESS_PATH}

      CHAT_SERVICE_URL: http://chat-service:8085/chat

      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - ecommerce-network


  # =========================================================
  # Chat Service
  # =========================================================
  chat-service:
    image: vothanhthienlong/chat-service:latest
    container_name: chat-service
    restart: unless-stopped

    environment:

      GEMINI_KEY: ${GEMINI_KEY}

      MONGODB_URI: mongodb://mongodb:27017/mydb

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vector_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      VECTOR_DB_CONNECTION: jdbc:postgresql://postgres:5432/vector_db
      VECTOR_DB_USERNAME: ${POSTGRES_USER}
      VECTOR_DB_PASSWORD: ${POSTGRES_PASSWORD}

      IDENTITY_SERVICE_URL: http://identity-service:8443/identity

    depends_on:

      mongodb:
        condition: service_healthy

      postgres:
        condition: service_healthy

      identity-service:
        condition: service_started

    networks:
      - ecommerce-network


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    image: vothanhthienlong/api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8888:8888"

    environment:

      IDENTITY_SERVICE_URL: http://identity-service:8443/identity

      CHAT_SERVICE_URL: http://chat-service:8085/chat

    depends_on:

      identity-service:
        condition: service_started

      chat-service:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================================================
  # Nginx Reverse Proxy
  # =========================================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api-gateway:
        condition: service_started

      chat-service:
        condition: service_started

    networks:
      - ecommerce-network


# =========================================================
# Volumes
# =========================================================

volumes:

  mysql_data:
    name: ecommerce_mysql_data

  redis_data:
    name: ecommerce_redis_data

  mongo_data:
    name: ecommerce_mongo_data

  postgres_data:
    name: ecommerce_postgres_data

# =========================================================
# Network
# =========================================================

networks:

  ecommerce-network:
    name: ecommerce-network
    driver: bridge